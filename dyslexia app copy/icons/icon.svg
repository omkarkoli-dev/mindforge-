<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#DBEAFE" stroke-width="12" opacity="0.35" />

  <!-- Electric Spark ⚡ -->
  <path d="M 270 120 L 170 260 L 250 260 L 220 392 L 342 232 L 272 232 Z"
        fill="#FEF08A"
        stroke="#CA8A04"
        stroke-width="6"
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
